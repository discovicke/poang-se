name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p server/wwwroot
          cp -r client/dist/. server/wwwroot/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish backend
        run: dotnet publish server/server.csproj -c Release -o ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Zip publish output
        run: cd publish && zip -r ../publish.zip .

      - name: Deploy to Azure App Service
        run: az webapp deploy --name pongapp-api --resource-group pongapp-rg --src-path ./publish.zip --type zip
